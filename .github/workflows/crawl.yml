name: Copy library catalogs
on:
  schedule:
    - cron: "17 */3 * * *"   # every 3 hours: adds newly requested libraries, refreshes any copy older than 6 days
  workflow_dispatch:
concurrency: { group: crawl, cancel-in-progress: false }
permissions: { contents: write }
jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 345
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Load the copies made so far
        run: |
          REPO="https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          git clone --depth 1 --branch gh-pages "$REPO" out || { mkdir out && git -C out init -q && git -C out remote add origin "$REPO"; }
      - name: Copy catalogs, publishing every ~20 minutes
        run: |
          publish() {
            ( cd out && touch .nojekyll \
              && git config user.name "library-copier" && git config user.email "noreply@users.noreply.github.com" \
              && git checkout -q --orphan "p$RANDOM" && git add -A \
              && git commit -q -m "Catalog copies $(date -u +%F)" \
              && git push -q -f origin HEAD:gh-pages ) || true
          }
          for i in $(seq 1 13); do
            rc=0; node crawl.mjs --out out --budget-min 20 || rc=$?
            publish
            [ "$rc" = 3 ] && break
          done
